<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <!-- Ilustração original e esquemática (não é o radar oficial do jogo) -->
  <defs>
    <pattern id="grade" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#2a3038" stroke-width="1"/>
    </pattern>
    <radialGradient id="fumaca" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d9dde3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d9dde3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" fill="#1b1f24"/>
  <rect width="600" height="340" fill="url(#grade)"/>

  <!-- Corredores esquemáticos -->
  <g fill="none" stroke="#4a5563" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 290 H300 V170 H470"/>
    <path d="M300 170 V70 H470"/>
    <path d="M60 290 V120 H160"/>
  </g>

  <!-- Bomb A -->
  <circle cx="470" cy="70" r="34" fill="#5d79ae" fill-opacity="0.25" stroke="#5d79ae" stroke-width="3"/>
  <text x="470" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#5d79ae">A</text>

  <!-- Bomb B (alvo da execução) -->
  <circle cx="160" cy="120" r="40" fill="#de9b35" fill-opacity="0.25" stroke="#de9b35" stroke-width="4"/>
  <text x="160" y="131" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#de9b35">B</text>

  <!-- Smokes da execução -->
  <circle cx="225" cy="105" r="26" fill="url(#fumaca)"/>
  <circle cx="215" cy="160" r="26" fill="url(#fumaca)"/>
  <circle cx="110" cy="70" r="26" fill="url(#fumaca)"/>

  <!-- Rota do time TR -->
  <path d="M90 270 C90 210 120 175 140 155" fill="none" stroke="#de9b35" stroke-width="3" stroke-dasharray="8 6"/>
  <polygon points="140,155 128,160 136,148" fill="#de9b35"/>

  <text x="580" y="320" text-anchor="end" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="6" fill="#de9b35">MIRAGE</text>
</svg>
